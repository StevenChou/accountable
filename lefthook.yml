assert_lefthook_installed: true
glob_matcher: doublestar

pre-commit:
  piped: true
  jobs:
    - name: prettier
      glob:
        - 'frontend/**'
        - 'scripts/*.mjs'
        - 'eslint.config.js'
        - '.claude/settings.json'
        - 'lefthook.yml'
      run: npm exec -- prettier --write --ignore-unknown -- {staged_files}
      stage_fixed: true

    - name: ruff format
      glob: 'backend/**/*.py'
      run: uv run --no-sync ruff format --force-exclude -- {staged_files}
      stage_fixed: true

    - name: eslint
      glob:
        - 'frontend/**/*.{js,mjs,ts,tsx}'
        - 'scripts/*.mjs'
        - 'eslint.config.js'
      run: npm exec -- eslint --max-warnings=0 --no-warn-ignored -- {staged_files}

    - name: ruff check
      glob: 'backend/**/*.py'
      run: uv run --no-sync ruff check --force-exclude -- {staged_files}

    - name: types
      run: npm run typecheck

    - name: gitleaks
      run: node scripts/check-secrets.mjs --staged
