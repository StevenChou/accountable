name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安裝 Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  gitleaks.tar.gz\n' "$GITLEAKS_SHA256" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          printf '%s\n' "$PWD" >> "$GITHUB_PATH"

      - name: 掃描 Git 歷史
        run: gitleaks git --redact=100 --no-banner --ignore-gitleaks-allow --log-opts=--all .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: 安裝相依套件
        run: |
          npm ci
          uv sync --locked --python 3.12

      - name: 執行快速檢查
        run: npm run check:quick
